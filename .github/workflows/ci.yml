name: ci

on:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soc2
          POSTGRES_PASSWORD: soc2
          POSTGRES_DB: soc2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soc2 -d soc2"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum
      - name: Fetch dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://soc2:soc2@localhost:5432/soc2?sslmode=disable
        run: go test ./...

  webapp:
    name: Webapp (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run build

  templates:
    name: Templates (Terraform fmt/validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9
      - name: Validate modules
        run: bash scripts/validate-templates.sh
