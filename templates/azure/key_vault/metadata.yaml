name: key_vault
resource_types:
  - azurerm_key_vault
description: SOC2-compliant Azure Key Vault with soft delete, purge protection and no public network access.
version: 1.0.0
category: security
controls:
  - CC6.1
  - CC6.7
  - C1.1
  - C1.2
dependencies: []
tests:
  - checkov
  - tfsec
variables:
  - name: vault_name
    type: string
    required: true
  - name: resource_group_name
    type: string
    required: true
  - name: location
    type: string
    required: false
  - name: tenant_id
    type: string
    required: true
  - name: soft_delete_retention_days
    type: number
    required: false
  - name: enabled_for_disk_encryption
    type: bool
    required: false