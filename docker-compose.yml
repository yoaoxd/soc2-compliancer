services:
  postgres:
    image: postgres:16-alpine
    container_name: soc2-postgres
    environment:
      POSTGRES_USER: soc2
      POSTGRES_PASSWORD: soc2
      POSTGRES_DB: soc2
    ports:
      - "5433:5432"
    volumes:
      - soc2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc2 -d soc2"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  soc2_pgdata: